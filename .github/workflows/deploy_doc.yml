name: deploy-docs
on:
  push:
    branches: 
      - develop
    paths-ignore:
      - README.md
      - LICENSE

jobs:
  deploy:
    # needs: dependencies
    name: Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #使用pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.11
      
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 安装文档所需依赖
      - name: Install Docs Dependencies
        run: pnpm --filter site install
      #打包Docs
      - name: Build Docs
        run: pnpm -w run docs:build
      
      # 部署到github pages
      - name: Deploy Docs
        uses: peaceiris/actions-gh-pages@v4 # 使用部署到 GitHub pages 的 action
        with:
          publish_dir: ./site/docs/.vitepress/dist # 部署打包后的 dist 目录
          github_token: ${{ secrets.DEPLOY_SECRET }} # secret 名
          user_name: ${{ secrets.MY_USER_NAME }}
          user_email: ${{ secrets.MY_USER_EMAIL }}
          commit_message: 自动部署 # 部署时的 git 提交信息，自由填写
        # run: pnpm run deploy -F site